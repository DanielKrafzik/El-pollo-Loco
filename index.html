<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="favicon" href="./img/1.Sharkie/1.IDLE/1.png">
    <title>Sharkie</title>
    <script src="./classes/keyboard.class.js"></script>    
    <script src="./classes/drawable-object.class.js"></script>  
    <script src="./classes/movable-object.class.js"></script>
    <script src="./classes/endboss.class.js"></script>
    <script src="./classes/shark.class.js"></script>
    <script src="./classes/enemies.class.js"></script>  
    <script src="./classes/status-bar.class.js"></script>
    <script src="./classes/endboss-bar.class.js"></script>
    <script src="./classes/coin-counter.class.js"></script>
    <script src="./classes/coin.class.js"></script>
    <script src="./classes/poison-counter.class.js"></script>
    <script src="./classes/poison.class.js"></script>
    <script src="./classes/world.class.js"></script>
    <script src="./classes/background-object.class.js"></script>
    <script src="./classes/bubble.class.js"></script>
    <script src="./classes/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js" defer></script>
</head>
<body onload="init()">

    <div id="game-wrapper">
        <canvas id="canvas" width="960" height="540"></canvas>

        <div id="start-screen">
            <h1>Sharkie</h1>
            <button id="play-btn" class="start-btn"></button>
            <button id="fullscreen-btn" class="start-btn"></button>
            <button id="controls-btn">Controls</button>
        </div>

        <div id="controls-screen" class="d-none">
            <h2>Controls</h2>
            <div>
                <p>Move Sharkie:</p>
                <img src="./img/6.Botones/Key/arrow keys.png" alt="">
            </div>
            <div>
                <p>Shoot normal Bubbles:</p>
                <img src="./img/6.Botones/Key/D key.png" alt="">
            </div>
            <div>
                <p>Shoot poison Bubbles:</p>
                <img src="./img/6.Botones/Key/Space Bar key.png" alt="">
            </div>
            <button id="close-controls-btn" class="start-btn">Back</button>
        </div>
    </div>

</body>
</html>
